services:
  gastos_mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastos_mcp
    working_dir: /app
    ports:
      - "3101:3101"
    env_file:
      - /root/gastos-mcp.env
    environment:
      PORT: "3101"
      PENDIENTES_DIR: "/app/pendientes"
      CODEX_BIN: "codex"
      CODEX_TIMEOUT_MS: "600000"
      HOME: "/home/node"

    volumes:
      - ./:/app
      - ./pendientes:/app/pendientes
      - /root/.codex:/home/node/.codex
      - ./node_modules:/app/node_modules
      - /root/gastos-mcp.env:/app/.env

    command: >
      bash -lc "
        set -e;
        mkdir -p /app/pendientes /home/node;
        npm install;
        node server.js
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3101/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
